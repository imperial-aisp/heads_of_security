[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heads-of-security"
version = "0.1.0"
description = "Heads of Security: trained per-head trust-channel gates on attention, for gpt-oss and Llama (HuggingFace + vLLM)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

dependencies = [
    "torch>=2.9.1",
    "transformers==5.9.0",
    "safetensors>=0.5",
    "huggingface-hub>=0.36.0",
    "accelerate>=1.12.0",
    "openai-harmony>=0.0.8",
    "numpy>=2.2.0",
]

[project.optional-dependencies]
vllm = ["vllm==0.27.1", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2"]
demos = ["matplotlib>=3.10", "jupyter>=1.1"]
# Gate training (torchtune full-DPO recipe under FSDP2). torchtune 0.6.1 is its final release and
# needs torchao < 0.16, hence the pin. `uv sync --extra train`.
train = ["torchtune==0.6.1", "torchao==0.13.0", "datasets>=4.4", "wandb>=0.23", "tqdm>=4.66", "omegaconf>=2.3"]
dev = ["pytest>=8", "ruff>=0.8"]

# vLLM loads this in every process it creates (API server, EngineCore, each worker) via
# vllm.plugins.load_general_plugins(), so the gated model classes and the channel runner
# patch do not depend on fork inheritance. Needs the package INSTALLED (`uv sync` /
# `pip install -e .`); a bare PYTHONPATH=src checkout has no entry-point metadata.
[project.entry-points."vllm.general_plugins"]
heads_of_security_vllm_gates = "heads_of_security.vllm_gates:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
